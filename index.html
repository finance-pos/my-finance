<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Direct ID & Password Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0e1621;
            --panel-bg: #17212b;
            --text-color: #f5f5f5;
            --text-secondary: #879097;
            --my-message: #2b5278;
            --other-message: #182533;
            --border-color: #0f1a24;
        }

        body {
            font-family: 'Khmer OS Battambang', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        @media (min-width: 481px) {
            .app-container {
                height: 92vh;
                border-radius: 12px;
                border: 1px solid #222e3c;
            }
        }

        .app-header {
            background-color: var(--panel-bg);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #ff5252;
            border-radius: 50%;
        }
        .status-dot.online {
            background-color: #4caf50;
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .screen.active {
            display: flex;
        }

        /* Chat List / Home Screen */
        .home-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex: 1;
        }
        .card-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .card-box h4 { margin: 0 0 10px 0; color: #5288c1; }
        .card-box input {
            width: 100%;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
            outline: none;
        }
        .card-box button {
            width: 100%;
            padding: 10px;
            background: #2b5278;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .card-box button:hover { background: #386795; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .chat-item:hover { background-color: rgba(255,255,255,0.05); }
        .avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #0088cc, #229ed9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white; flex-shrink: 0;
        }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .chat-last-msg { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat Room Screen */
        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #0e1621;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            word-break: break-word;
            position: relative;
            line-height: 1.4;
        }
        .message.sent { background-color: var(--my-message); align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.received { background-color: var(--other-message); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 2px; }

        .input-area {
            padding: 10px 15px;
            background-color: var(--panel-bg);
            display: flex; align-items: center; gap: 10px;
            border-top: 1px solid var(--border-color);
        }
        .input-area input[type="text"] {
            flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none;
        }
        .icon-btn {
            background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; padding: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { color: white; }

        /* Bottom Nav */
        .bottom-nav {
            height: 55px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: var(--text-secondary);
            font-size: 11px; cursor: pointer; gap: 3px; background: none; border: none;
        }
        .nav-item.active { color: #5288c1; }
        .nav-item span { font-size: 20px; }

        .media-preview { max-width: 180px; border-radius: 8px; display: block; margin-top: 4px; }

        #map-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center;
        }
        #map { width: 85%; max-width: 380px; height: 320px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Screen 1: Home / Setup ID & Password -->
    <div id="screen-home" class="screen active">
        <div class="app-header">
            <div class="header-title">
                <span id="header-status-dot" class="status-dot"></span> 
                <span>Chat Private (ID & Password)</span>
            </div>
        </div>

        <div class="home-content">
            <!-- ផ្នែកទី១៖ បង្កើត ID ខ្លួនឯងដើម្បីឱ្យគេខល/ឆាតមក -->
            <div class="card-box">
                <h4>👤 ព័ត៌មានផ្ទាល់ខ្លួនរបស់អ្នក</h4>
                <input type="text" id="my-id" placeholder="កំណត់ ID របស់អ្នក (ឧ៖ Dara123)">
                <input type="password" id="my-pass" placeholder="កំណត់ Password របស់អ្នក (ឧ៖ 1234)">
                <button onclick="registerMyProfile()">ចុះឈ្មោះ / ចាប់ផ្តើមរង់ចាំ</button>
            </div>

            <!-- ផ្នែកទី២៖ ដាក់ ID និង Password របស់មិត្តភក្តិដើម្បីតភ្ជាប់ទៅកាន់គាត់ -->
            <div class="card-box">
                <h4>🔗 តភ្ជាប់ទៅកាន់ដៃគូ (Direct Chat)</h4>
                <input type="text" id="target-id" placeholder="ID របស់មិត្តភក្តិ">
                <input type="password" id="target-pass" placeholder="Password របស់មិត្តភក្តិ">
                <button onclick="connectToTarget()" style="background: #229ed9;">តភ្ជាប់ទៅកាន់ដៃគូ</button>
            </div>

            <div style="text-align: center; font-size: 12px; color: var(--text-secondary);" id="connection-log">
                ស្ថានភាព៖ សូមចុះឈ្មោះ ID របស់អ្នកសិន
            </div>
        </div>
    </div>

    <!-- Screen 2: Chat List Menu -->
    <div id="screen-chats" class="screen">
        <div class="app-header">
            <div class="header-title">
                <span class="status-dot online"></span> 
                <span id="current-user-title">Chats</span>
            </div>
            <button class="icon-btn" onclick="logoutProfile()" title="ចាកចេញ">⚙️</button>
        </div>
        <div class="chat-list">
            <div class="chat-item" onclick="openChatRoom()">
                <div class="avatar">💬</div>
                <div class="chat-info">
                    <div class="chat-name" id="partner-display-name">ដៃគូរសន្ទនា</div>
                    <div class="chat-last-msg" id="last-msg-preview">បានតភ្ជាប់ជោគជ័យ...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen 3: Chat Room -->
    <div id="screen-chatroom" class="screen">
        <div class="app-header">
            <button class="icon-btn" onclick="backToChats()" style="font-size: 20px;">〈</button>
            <div class="header-title" style="flex:1; margin-left: 10px;">
                <span style="font-size: 15px;" id="chat-header-name">Direct Chat</span>
            </div>
        </div>
        
        <div class="messages-container" id="chatMessages"></div>

        <div class="input-area">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(this)">
            <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="រូបភាព">📎</button>
            <input type="text" id="messageInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendText()">
            <button class="icon-btn" id="micBtn" onclick="toggleRecord()" title="សំឡេង">🎤</button>
            <button class="icon-btn" onclick="shareLocation()" title="ទីតាំង">📍</button>
            <button class="icon-btn" onclick="sendText()" style="color: #229ed9;">➤</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active"><span>💬</span>Chats</button>
        <button class="nav-item" onclick="alert('មុខងារ Contacts')"><span>👤</span>Contacts</button>
        <button class="nav-item" onclick="alert('មុខងារ Settings')"><span>⚙️</span>Settings</button>
    </div>
</div>

<!-- Map Modal -->
<div id="map-modal" onclick="this.style.display='none'">
    <div id="map" onclick="event.stopPropagation()"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let peer;
    let conn;
    let myUniqueKey = "";
    let targetUniqueKey = "";
    let messagesContainer = document.getElementById('chatMessages');

    function registerMyProfile() {
        let id = document.getElementById('my-id').value.trim();
        let pass = document.getElementById('my-pass').value.trim();
        if (!id || !pass) return alert('សូមបញ្ចូល ID និង Password របស់អ្នកសិន!');

        myUniqueKey = `tg-direct-${id}-${pass}`;
        
        if (peer) peer.destroy();
        peer = new Peer(myUniqueKey);

        peer.on('open', () => {
            document.getElementById('connection-log').innerText = "ស្ថានភាព៖ បានចុះឈ្មោះ និងកំពុងរង់ចាំការតភ្ជាប់...";
            document.getElementById('header-status-dot').classList.add('online');
            document.getElementById('current-user-title').innerText = "User: " + id;
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert('ID និង Password នេះមានគេប្រើរួចហើយ ឬកំពុងដំណើរការ!');
            } else {
                alert('មានបញ្ហាក្នុងការតភ្ជាប់៖ ' + err.type);
            }
        });

        // ពេលមានគេខល/ឆាតចូលមកចំ ID & Pass របស់យើង
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            switchToChatsList();
        });
    }

    function connectToTarget() {
        let tid = document.getElementById('target-id').value.trim();
        let tpass = document.getElementById('target-pass').value.trim();
        if (!tid || !tpass) return alert('សូមបញ្ចូល ID និង Password របស់មិត្តភក្តិដែលចង់តភ្ជាប់!');

        if (!peer) {
            // បើទាន់បានបង្កើត Profile ខ្លួនឯង ឱ្យវាបង្កើត Profile បណ្តោះអាសន្ន
            let randomId = "guest-" + Math.floor(Math.random() * 10000);
            peer = new Peer(randomId);
            peer.on('open', () => {
                makeConnection(tid, tpass);
            });
        } else {
            makeConnection(tid, tpass);
        }
    }

    function makeConnection(tid, tpass) {
        targetUniqueKey = `tg-direct-${tid}-${tpass}`;
        document.getElementById('connection-log').innerText = "ស្ថានភាព៖ កំពុងតភ្ជាប់ទៅកាន់ " + tid + "...";

        conn = peer.connect(targetUniqueKey);
        setupConnection();
    }

    function setupConnection() {
        if (!conn) return;

        conn.on('open', () => {
            switchToChatsList();
        });

        conn.on('data', (data) => {
            displayMessage(data, 'received');
            updateLastMessage(data);
        });
    }

    function switchToChatsList() {
        document.getElementById('screen-home').classList.remove('active');
        document.getElementById('screen-chats').classList.add('active');
        document.getElementById('partner-display-name').innerText = "ការសន្ទនាផ្ទាល់ខ្លួន";
    }

    function logoutProfile() {
        if(peer) peer.destroy();
        document.getElementById('screen-chats').classList.remove('active');
        document.getElementById('screen-home').classList.add('active');
        document.getElementById('connection-log').innerText = "ស្ថានភាព៖ បានចាកចេញ";
        document.getElementById('header-status-dot').classList.remove('online');
    }

    function openChatRoom() {
        document.getElementById('screen-chats').classList.remove('active');
        document.getElementById('screen-chatroom').classList.add('active');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function backToChats() {
        document.getElementById('screen-chatroom').classList.remove('active');
        document.getElementById('screen-chats').classList.add('active');
    }

    function getTimeString() {
        let now = new Date();
        return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    }

    function appendMessageHtml(content, type) {
        let div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `${content}<div class="msg-time">${getTimeString()} ✓✓</div>`;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function updateLastMessage(data) {
        let preview = document.getElementById('last-msg-preview');
        if (data.type === 'text') preview.innerText = data.content;
        else if (data.type === 'image') preview.innerText = '[រូបភាព]';
        else if (data.type === 'audio') preview.innerText = '[សារសំឡេង]';
        else if (data.type === 'location') preview.innerText = '[ទីតាំង]';
    }

    function displayMessage(data, type) {
        if (data.type === 'text') {
            appendMessageHtml(data.content, type);
        } else if (data.type === 'image') {
            appendMessageHtml(`<img src="${data.content}" class="media-preview">`, type);
        } else if (data.type === 'audio') {
            appendMessageHtml(`<audio controls src="${data.content}"></audio>`, type);
        } else if (data.type === 'location') {
            appendMessageHtml(`<div style="cursor:pointer;" onclick="openMap(${data.lat}, ${data.lon})">📍 ទីតាំងដៃគូ<br><small style="color:#ddd;">ចុចដើម្បីមើលផែនទី</small></div>`, type);
        }
        updateLastMessage(data);
    }

    function sendData(data) {
        if (conn && conn.open) {
            conn.send(data);
        } else {
            alert('ការតភ្ជាប់ត្រូវបានផ្ដាច់!');
        }
    }

    function sendText() {
        let text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        let data = { type: 'text', content: text };
        appendMessageHtml(text, 'sent');
        sendData(data);
        updateLastMessage(data);
        document.getElementById('messageInput').value = '';
    }

    function sendImage(input) {
        let file = input.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = (e) => {
            let data = { type: 'image', content: e.target.result };
            appendMessageHtml(`<img src="${e.target.result}" class="media-preview">`, 'sent');
            sendData(data);
            updateLastMessage(data);
        };
        reader.readAsDataURL(file);
    }

    let mediaRecorder, audioChunks = [], isRecording = false;
    async function toggleRecord() {
        let micBtn = document.getElementById('micBtn');
        if (!isRecording) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    let blob = new Blob(audioChunks, { type: 'audio/webm' });
                    let reader = new FileReader();
                    reader.onloadend = () => {
                        let data = { type: 'audio', content: reader.result };
                        appendMessageHtml(`<audio controls src="${reader.result}"></audio>`, 'sent');
                        sendData(data);
                        updateLastMessage(data);
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.style.color = 'red';
            } catch(e) {
                alert('មិនអាចបើក Microphone បានទេ។');
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.style.color = 'var(--text-secondary)';
        }
    }

    function shareLocation() {
        navigator.geolocation.getCurrentPosition(pos => {
            let lat = pos.coords.latitude, lon = pos.coords.longitude;
            let data = { type: 'location', lat, lon };
            appendMessageHtml(`<div style="cursor:pointer;" onclick="openMap(${lat}, ${lon})">📍 ទីតាំងរបស់ខ្ញុំ<br><small style="color:#ddd;">ចុចដើម្បីមើលផែនទី</small></div>`, 'sent');
            sendData(data);
            updateLastMessage(data);
        }, () => {
            alert('មិនអាចទាញយកទីតាំងបានទេ។');
        });
    }

    function openMap(lat, lon) {
        document.getElementById('map-modal').style.display = 'flex';
        let map = L.map('map').setView([lat, lon], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([lat, lon]).addTo(map).bindPopup('ទីតាំង').openPopup();
    }
</script>

</body>
</html>
