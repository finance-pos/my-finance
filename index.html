<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កម្មវិធីគ្រប់គ្រងហិរញ្ញវត្ថុ - Google Sheets Database</title>
  
  <!-- Font ខ្មែរ Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Kantumruy Pro"', 'sans-serif'],
          },
          colors: {
            pureBlue: '#1D4ED8',
            softBlueBg: '#F1F5F9',
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ ដាក់ Web App URL របស់ Google Apps Script ត្រង់នេះ ⚠️
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxgym5dAoUwgxyuO4clrCBZ4TPXUBYKBmqCto0sjj2viCWg4eTa8NELSAlydEefvcAG/exec";

    function App() {
      const [filter, setFilter] = useState('daily');
      const [loading, setLoading] = useState(false);
      
      // ទិន្នន័យចំណូលចំណាយ + LocalStorage
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem("my-transactions");
        return saved ? JSON.parse(saved) : [
          { id: 1, title: 'ប្រាក់ខែ', amount: 800, type: 'income', category: 'ការងារ', date: '2026-08-12' },
          { id: 2, title: 'ទិញម្ហូបអាហារ', amount: 15, type: 'expense', category: 'ចំណាយប្រចាំថ្ងៃ', date: '2026-08-12' },
          { id: 3, title: 'ថ្លៃសាំង', amount: 5, type: 'expense', category: 'ធ្វើដំណើរ', date: '2026-08-11' }
        ];
      });

      // Form States
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState('ទូទៅ');
      const [showForm, setShowForm] = useState(false);

      useEffect(() => {
        localStorage.setItem("my-transactions", JSON.stringify(transactions));
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [transactions, showForm]);

      // បន្ថែមទិន្នន័យទៅ LocalStorage និងផ្ញើទៅ Google Sheet
      const handleAddTransaction = async (e) => {
        e.preventDefault();
        if (!title || !amount) return;

        setLoading(true);

        const newTx = {
          id: Date.now(),
          title,
          amount: parseFloat(amount),
          type,
          category,
          date: new Date().toISOString().split('T')[0]
        };

        // ១. រក្សាទុកក្នុង UI/LocalStorage ភ្លាមៗ
        setTransactions([newTx, ...transactions]);

        // ២. ផ្ញើទិន្នន័យទៅ Google Sheets
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(newTx),
            });
            console.log("រក្សាទុកក្នុង Google Sheet រួចរាល់!");
          } catch (error) {
            console.error("មានបញ្ហាក្នុងការផ្ញើទៅ Google Sheet:", error);
          }
        }

        setTitle('');
        setAmount('');
        setShowForm(false);
        setLoading(false);
      };

      const handleDelete = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
      };

      const totalIncome = transactions
        .filter(t => t.type === 'income')
        .reduce((acc, curr) => acc + curr.amount, 0);

      const totalExpense = transactions
        .filter(t => t.type === 'expense')
        .reduce((acc, curr) => acc + curr.amount, 0);

      const balance = totalIncome - totalExpense;

      return (
        <div className="p-3 sm:p-6 max-w-4xl mx-auto space-y-5">
          
          {/* ---------------- ផ្នែកបង្ហាញទឹកប្រាក់ - Classic Pure Blue Theme ---------------- */}
          <div className="bg-pureBlue text-white rounded-3xl p-6 shadow-xl relative overflow-hidden space-y-6">
            
            {/* Header / Filter Bar */}
            <div className="flex justify-between items-center text-xs">
              <span className="text-blue-100 font-medium">របាយការណ៍៖ {filter === 'daily' ? 'ប្រចាំថ្ងៃ' : filter === 'weekly' ? 'ប្រចាំសប្តាហ៍' : 'ប្រចាំឆ្នាំ'}</span>
              <div className="flex gap-1.5 bg-black/20 p-1 rounded-full">
                {['daily', 'weekly', 'yearly'].map((mode) => (
                  <button
                    key={mode}
                    onClick={() => setFilter(mode)}
                    className={`px-3 py-1 rounded-full text-xs transition ${
                      filter === mode ? 'bg-white text-pureBlue font-bold shadow' : 'text-blue-100 hover:text-white'
                    }`}
                  >
                    {mode === 'daily' ? 'ថ្ងៃ' : mode === 'weekly' ? 'សប្តាហ៍' : 'ឆ្នាំ'}
                  </button>
                ))}
              </div>
            </div>

            {/* ផ្នែក Donut Chart + Cards */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
              
              {/* Donut Chart (សមតុល្យសរុប) */}
              <div className="md:col-span-5 flex justify-center items-center">
                <div className="relative w-40 h-40 flex items-center justify-center">
                  <div 
                    className="w-full h-full rounded-full shadow-md"
                    style={{
                      background: 'conic-gradient(#60A5FA 0deg 110deg, #F87171 110deg 360deg)',
                      maskImage: 'radial-gradient(transparent 58%, black 59%)',
                      WebkitMaskImage: 'radial-gradient(transparent 58%, black 59%)'
                    }}
                  ></div>

                  {/* Icon & Amount Inside Donut */}
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <i data-lucide="wallet" className="w-6 h-6 text-blue-200 mb-1"></i>
                    <span className="text-xs text-blue-100 font-light">ប្រាក់នៅសល់</span>
                    <span className="text-xl font-bold text-white">${balance.toFixed(2)}</span>
                  </div>
                </div>
              </div>

              {/* ប្រអប់បង្ហាញ ចំណូល / ចំណាយ ពណ៌ White Clean */}
              <div className="md:col-span-7 space-y-3">
                
                {/* ចំណូលសរុប */}
                <div className="bg-white text-slate-800 px-5 py-3.5 rounded-2xl flex justify-between items-center shadow-md">
                  <div>
                    <div className="text-xs text-slate-400 font-medium">ចំណូលសរុប</div>
                    <div className="text-xl font-bold text-emerald-600">+${totalIncome.toFixed(2)}</div>
                  </div>
                  <span className="bg-emerald-100 text-emerald-600 p-2 rounded-xl">
                    <i data-lucide="arrow-up-circle" className="w-5 h-5"></i>
                  </span>
                </div>

                {/* ចំណាយសរុប */}
                <div className="bg-white text-slate-800 px-5 py-3.5 rounded-2xl flex justify-between items-center shadow-md">
                  <div>
                    <div className="text-xs text-slate-400 font-medium">ចំណាយសរុប</div>
                    <div className="text-xl font-bold text-rose-600">-${totalExpense.toFixed(2)}</div>
                  </div>
                  <span className="bg-rose-100 text-rose-600 p-2 rounded-xl">
                    <i data-lucide="arrow-down-circle" className="w-5 h-5"></i>
                  </span>
                </div>

              </div>

            </div>
          </div>

          {/* ---------------- ផ្នែកខាងក្រោម៖ ប្រវត្តិ និង Form ---------------- */}
          <div className="flex justify-between items-center pt-2">
            <h2 className="text-lg font-bold text-slate-800">ប្រវត្តិប្រតិបត្តិការ</h2>
            <button 
              onClick={() => setShowForm(!showForm)}
              className="flex items-center gap-1.5 bg-pureBlue text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-blue-800 transition shadow"
            >
              <i data-lucide="plus-circle" className="w-4 h-4"></i>
              {showForm ? 'បិទទម្រង់' : 'បន្ថែមថ្មី'}
            </button>
          </div>

          {/* Form */}
          {showForm && (
            <form onSubmit={handleAddTransaction} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 text-sm">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">បរិយាយ</label>
                  <input 
                    type="text" 
                    value={title} 
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="ឧ. ទិញបាយ, ប្រាក់ខែ" 
                    className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:border-pureBlue"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">ចំនួនទឹកប្រាក់ ($)</label>
                  <input 
                    type="number" 
                    step="0.01"
                    value={amount} 
                    onChange={(e) => setAmount(e.target.value)}
                    placeholder="0.00" 
                    className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:border-pureBlue"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">ប្រភេទប្រតិបត្តិការ</label>
                  <select 
                    value={type} 
                    onChange={(e) => setType(e.target.value)}
                    className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:border-pureBlue"
                  >
                    <option value="expense">ចំណាយ (-)</option>
                    <option value="income">ចំណូល (+)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">ជំពូក</label>
                  <input 
                    type="text" 
                    value={category} 
                    onChange={(e) => setCategory(e.target.value)}
                    placeholder="ឧ. ម្ហូបអាហារ, ធ្វើដំណើរ" 
                    className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:border-pureBlue"
                  />
                </div>
              </div>
              <button 
                type="submit" 
                disabled={loading}
                className="w-full bg-pureBlue text-white py-2.5 rounded-xl font-medium hover:bg-blue-800 transition flex justify-center items-center gap-2"
              >
                {loading ? 'កំពុងរក្សាទុកទៅ Google Sheet...' : 'រក្សាទុកទិន្នន័យ'}
              </button>
            </form>
          )}

          {/* List */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="divide-y divide-slate-100">
              {transactions.length === 0 ? (
                <div className="p-6 text-center text-slate-400">មិនទាន់មានទិន្នន័យនៅឡើយទេ</div>
              ) : (
                transactions.map((t) => (
                  <div key={t.id} className="p-3.5 flex justify-between items-center hover:bg-slate-50 transition">
                    <div className="flex items-center gap-3">
                      <div className={`p-2 rounded-xl ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                        <i data-lucide={t.type === 'income' ? 'arrow-up-circle' : 'arrow-down-circle'} className="w-5 h-5"></i>
                      </div>
                      <div>
                        <div className="font-semibold text-slate-800 text-sm">{t.title}</div>
                        <div className="text-xs text-slate-400">{t.category} • {t.date}</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className={`font-bold text-sm ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}`}>
                        {t.type === 'income' ? '+' : '-'}${t.amount.toFixed(2)}
                      </div>
                      <button onClick={() => handleDelete(t.id)} className="text-slate-300 hover:text-rose-600 transition">
                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
