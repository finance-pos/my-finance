<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>កម្មវិធីគ្រប់គ្រងហិរញ្ញវត្ថុ Pro</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F172A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      touch-action: manipulation;
      font-family: 'Kantumruy Pro', sans-serif;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      font-size: 16px !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .ios-scroll {
      -webkit-overflow-scrolling: touch;
    }
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
    }
    .btn-active {
      transition: transform 0.08s ease, opacity 0.08s ease;
    }
    .btn-active:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .pt-safe { padding-top: max(20px, env(safe-area-inset-top, 20px)); }
    .pb-safe { padding-bottom: max(30px, env(safe-area-inset-bottom, 30px)) !important; }
  </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-900 h-screen text-slate-800 dark:text-slate-100 overflow-hidden">

  <!-- Main Container -->
  <div class="flex flex-col h-full max-w-md mx-auto bg-[#F8FAFC] dark:bg-slate-900 border-x border-slate-200 dark:border-slate-800 relative shadow-2xl pt-safe">
    
    <!-- Header Card -->
    <div class="p-4 pb-0">
      <div class="bg-gradient-to-br from-[#0F172A] via-[#1E1B4B] to-[#311042] text-white p-5 rounded-3xl shadow-xl space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-1.5 text-xs text-slate-300">
            <i data-lucide="shield-check" class="w-4 h-4 text-blue-400"></i>
            <span>សមតុល្យសរុប</span>
          </div>
          <button id="currBtn" onclick="toggleCurrency()" class="btn-active px-3 py-0.5 text-xs font-bold bg-white/20 rounded-lg text-white">
            USD
          </button>
        </div>

        <div>
          <h2 id="totalBalance" class="text-3xl font-extrabold tracking-tight mt-1">$0.00</h2>
          <p class="text-xs text-slate-400 mt-0.5">ប្រព័ន្ធគ្រប់គ្រងហិរញ្ញវត្ថុ Pro</p>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10">
          <div class="bg-white/5 p-3 rounded-2xl flex items-center gap-2.5">
            <div class="p-2 bg-emerald-500/20 text-emerald-400 rounded-xl">
              <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="text-[10px] text-slate-400">ចំណូល</p>
              <p id="totalIncome" class="text-sm font-bold text-emerald-400">+$0.00</p>
            </div>
          </div>

          <div class="bg-white/5 p-3 rounded-2xl flex items-center gap-2.5">
            <div class="p-2 bg-rose-500/20 text-rose-400 rounded-xl">
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="text-[10px] text-slate-400">ចំណាយ</p>
              <p id="totalExpense" class="text-sm font-bold text-rose-400">-$0.00</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Content List -->
    <main class="flex-1 overflow-y-auto ios-scroll p-4 pb-32 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">ប្រវត្តិប្រតិបត្តិការ</h3>
        <span id="txCount" class="text-xs text-slate-400">0 ប្រតិបត្តិការ</span>
      </div>

      <div id="txList" class="space-y-2">
        <!-- List Items injected here -->
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around items-center px-4 pt-3 pb-safe fixed bottom-0 left-0 right-0 max-w-md mx-auto z-10">
      <button class="flex flex-col items-center gap-1 text-blue-600 font-bold">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[11px]">ទំព័រដើម</span>
      </button>

      <div class="relative -top-4">
        <button onclick="openForm()" class="btn-active w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-xl shadow-blue-600/30">
          <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
      </div>

      <button onclick="toggleDarkMode()" class="flex flex-col items-center gap-1 text-slate-400">
        <i data-lucide="moon" class="w-5 h-5"></i>
        <span class="text-[11px]">ម៉ូត</span>
      </button>
    </nav>

    <!-- Modal Form -->
    <div id="modalForm" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
      <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
          <h3 class="font-bold text-base">បន្ថែមប្រតិបត្តិការ</h3>
          <button onclick="closeForm()" class="btn-active text-slate-400">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form onsubmit="saveTransaction(event)" class="space-y-3">
          <div class="flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl text-xs font-bold">
            <button type="button" id="btnExpense" onclick="setType('expense')" class="btn-active flex-1 py-2 rounded-lg bg-rose-500 text-white">ចំណាយ</button>
            <button type="button" id="btnIncome" onclick="setType('income')" class="btn-active flex-1 py-2 rounded-lg text-slate-500">ចំណូល</button>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">បរិយាយ / ឈ្មោះ</label>
            <input type="text" id="txTitle" required placeholder="ឧ. ទិញកាហ្វេ" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">ចំនួនទឹកប្រាក់ ($)</label>
            <input type="number" step="0.01" id="txAmount" required placeholder="0.00" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">ប្រភេទ</label>
            <select id="txCategory" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2.5 text-xs">
              <option value="ម្ហូបអាហារ">ម្ហូបអាហារ</option>
              <option value="ធ្វើដំណើរ/ថ្លៃសាំង">ធ្វើដំណើរ/ថ្លៃសាំង</option>
              <option value="ការងារ/ប្រាក់ខែ">ការងារ/ប្រាក់ខែ</option>
              <option value="ទូទៅ">ទូទៅ</option>
            </select>
          </div>

          <button type="submit" class="btn-active w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg mt-2">
            រក្សាទុក
          </button>
        </form>
      </div>
    </div>

  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('pure_tx') || '[]');
    let currency = 'USD';
    let currentType = 'expense';
    let isDark = localStorage.getItem('dark_mode') === 'true';

    if (isDark) document.documentElement.classList.add('dark');

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function toggleCurrency() {
      triggerHaptic();
      currency = currency === 'USD' ? 'KHR' : 'USD';
      document.getElementById('currBtn').innerText = currency;
      render();
    }

    function toggleDarkMode() {
      triggerHaptic();
      isDark = !isDark;
      localStorage.setItem('dark_mode', isDark);
      document.documentElement.classList.toggle('dark');
    }

    function formatMoney(val) {
      if (currency === 'KHR') return (val * 4100).toLocaleString('km-KH') + ' ៛';
      return '$' + val.toFixed(2);
    }

    function setType(type) {
      triggerHaptic();
      currentType = type;
      const btnExp = document.getElementById('btnExpense');
      const btnInc = document.getElementById('btnIncome');
      if (type === 'expense') {
        btnExp.className = 'btn-active flex-1 py-2 rounded-lg bg-rose-500 text-white';
        btnInc.className = 'btn-active flex-1 py-2 rounded-lg text-slate-500';
      } else {
        btnInc.className = 'btn-active flex-1 py-2 rounded-lg bg-emerald-500 text-white';
        btnExp.className = 'btn-active flex-1 py-2 rounded-lg text-slate-500';
      }
    }

    function openForm() {
      triggerHaptic();
      document.getElementById('modalForm').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('modalForm').classList.add('hidden');
    }

    function saveTransaction(e) {
      e.preventDefault();
      triggerHaptic();

      const title = document.getElementById('txTitle').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const category = document.getElementById('txCategory').value;

      if (!title || isNaN(amount)) return;

      const newTx = {
        id: Date.now(),
        title,
        amount,
        type: currentType,
        category,
        date: new Date().toISOString().split('T')[0]
      };

      transactions.unshift(newTx);
      localStorage.setItem('pure_tx', JSON.stringify(transactions));

      document.getElementById('txTitle').value = '';
      document.getElementById('txAmount').value = '';
      closeForm();
      render();
    }

    function deleteTx(id) {
      triggerHaptic();
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('pure_tx', JSON.stringify(transactions));
      render();
    }

    function render() {
      let income = 0;
      let expense = 0;

      const listEl = document.getElementById('txList');
      listEl.innerHTML = '';

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;

        const item = document.createElement('div');
        item.className = 'bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 flex justify-between items-center shadow-sm';
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white ${t.type === 'income' ? 'bg-emerald-500' : 'bg-rose-500'}">
              <i data-lucide="${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
            </div>
            <div>
              <h4 class="font-semibold text-sm">${t.title}</h4>
              <p class="text-[11px] text-slate-400 mt-0.5">${t.category} • ${t.date}</p>
            </div>
          </div>
          <div class="text-right flex items-center gap-3">
            <span class="font-bold text-sm ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
              ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
            </span>
            <button onclick="deleteTx(${t.id})" class="btn-active text-slate-300 hover:text-red-500 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        listEl.appendChild(item);
      });

      document.getElementById('totalBalance').innerText = formatMoney(income - expense);
      document.getElementById('totalIncome').innerText = '+' + formatMoney(income);
      document.getElementById('totalExpense').innerText = '-' + formatMoney(expense);
      document.getElementById('txCount').innerText = `${transactions.length} ប្រតិបត្តិការ`;

      if (window.lucide) window.lucide.createIcons();
    }

    // Initial Render
    render();
  </script>
</body>
</html>
