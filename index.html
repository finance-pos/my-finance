<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>កម្មវិធីគ្រប់គ្រងហិរញ្ញវត្ថុ Pro</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="iconfinances.png">
  <link rel="apple-touch-icon" href="iconfinances.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ហិរញ្ញវត្ថុ">
  <meta name="theme-color" content="#0F172A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Kantumruy Pro"', 'sans-serif'] },
          colors: { pureBlue: '#1D4ED8' }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      touch-action: manipulation;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      font-size: 16px !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .ios-scroll {
      -webkit-overflow-scrolling: touch;
    }
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      background: transparent !important;
    }
    body, html, * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    
    .pt-safe {
      padding-top: max(20px, env(safe-area-inset-top, 20px));
    }
    .pb-safe {
      padding-bottom: max(30px, env(safe-area-inset-bottom, 30px)) !important;
    }

    /* ធ្វើឱ្យ Button មាន Feedback ចុចលឿនទាន់ចិត្ត */
    .btn-active {
      transition: transform 0.08s ease, opacity 0.08s ease;
    }
    .btn-active:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-900 font-sans h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200 overflow-hidden">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbygQbXEB-856p-WG2A6YADv7lRA5jHzcSh2eIFK3lipMmif_4dvC2_YMawaK7zncI21XA/exec";
    const EXCHANGE_RATE = 4100;

    const CATEGORIES = [
      'ម្ហូបអាហារ', 'ធ្វើដំណើរ/ថ្លៃសាំង', 'ការងារ/ប្រាក់ខែ', 
      'ការកម្សាន្ត', 'ការសិក្សា', 'ទិញអីវ៉ាន់/សម្ភារៈ', 
      'ផ្ទះ/ទឹកភ្លើង', 'សុខភាព', 'ទូទៅ'
    ];

    const WALLETS = ['លុយសុទ្ធ (Cash)', 'ABA Bank', 'ACLEDA Bank', 'ផ្សេងៗ'];

    const triggerHaptic = () => {
      if (navigator.vibrate) {
        navigator.vibrate(8);
      }
    };

    function App() {
      const [showSplash, setShowSplash] = useState(true);

      useEffect(() => {
        const timer = setTimeout(() => setShowSplash(false), 1200);
        return () => clearTimeout(timer);
      }, []);

      const [savedPin, setSavedPin] = useState(() => localStorage.getItem('app_pin') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('app_pin'));
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      
      const [isBiometricEnabled, setIsBiometricEnabled] = useState(() => localStorage.getItem('biometric_enabled') === 'true');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('dark_mode') === 'true');

      const [transactions, setTransactions] = useState(() => {
        try {
          const local = localStorage.getItem('local_transactions');
          return local ? JSON.parse(local) : [];
        } catch { return []; }
      });

      const [categoryBudgets, setCategoryBudgets] = useState(() => {
        try {
          const local = localStorage.getItem('category_budgets');
          return local ? JSON.parse(local) : { 'ម្ហូបអាហារ': 150, 'ការកម្សាន្ត': 50 };
        } catch { return {}; }
      });

      const [savingsGoals, setSavingsGoals] = useState(() => {
        try {
          const local = localStorage.getItem('savings_goals');
          return local ? JSON.parse(local) : [{ id: 1, title: 'ទិញទូរស័ព្ទថ្មី', target: 800, current: 350 }];
        } catch { return []; }
      });
      const [goalTitle, setGoalTitle] = useState('');
      const [goalTarget, setGoalTarget] = useState('');

      const [reminders, setReminders] = useState(() => {
        try {
          const local = localStorage.getItem('bill_reminders');
          return local ? JSON.parse(local) : [{ id: 1, title: 'ថ្លៃអ៊ីនធឺណិត', amount: 25, dueDate: '2026-03-05', category: 'ផ្ទះ/ទឹកភ្លើង' }];
        } catch { return []; }
      });
      const [billTitle, setBillTitle] = useState('');
      const [billAmount, setBillAmount] = useState('');
      const [billDueDate, setBillDueDate] = useState('');

      const [loading, setLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      
      const [activeTab, setActiveTab] = useState('home');
      const [timeFilter, setTimeFilter] = useState('thisMonth');
      const [search, setSearch] = useState('');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ទាំងអស់');
      const [currency, setCurrency] = useState('USD');
      const [budgetLimit, setBudgetLimit] = useState(() => parseFloat(localStorage.getItem('budgetLimit')) || 500);
      const [tempBudget, setTempBudget] = useState(budgetLimit);

      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [formCurrency, setFormCurrency] = useState('USD');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState(CATEGORIES[0]);
      const [wallet, setWallet] = useState(WALLETS[0]);
      const [receiptImage, setReceiptImage] = useState(null);
      const [selectedReceipt, setSelectedReceipt] = useState(null);
      const [showForm, setShowForm] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('local_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('category_budgets', JSON.stringify(categoryBudgets));
      }, [categoryBudgets]);

      useEffect(() => {
        localStorage.setItem('savings_goals', JSON.stringify(savingsGoals));
      }, [savingsGoals]);

      useEffect(() => {
        localStorage.setItem('bill_reminders', JSON.stringify(reminders));
      }, [reminders]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('dark_mode', darkMode);
      }, [darkMode]);

      const fetchData = useCallback(async () => {
        if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) return;
        setSyncing(true);
        try {
          const res = await fetch(GOOGLE_SHEET_URL);
          const data = await res.json();
          if (Array.isArray(data)) setTransactions(data.reverse());
        } catch (err) {
          console.error("Fetch Error:", err);
        }
        setSyncing(false);
      }, []);

      useEffect(() => { fetchData(); }, [fetchData]);

      useEffect(() => {
        if (window.lucide && !showSplash) {
          window.lucide.createIcons();
        }
      }, [activeTab, transactions, showForm, showSplash, selectedCategoryFilter]);

      const handleUnlock = (e) => {
        e.preventDefault();
        triggerHaptic();
        if (pinInput === savedPin) {
          setIsLocked(false);
          setPinError('');
          setPinInput('');
        } else {
          setPinError('លេខកូដមិនត្រឹមត្រូវឡើយ!');
          setPinInput('');
        }
      };

      const handleRegisterBiometric = async () => {
        triggerHaptic();
        try {
          if (!window.PublicKeyCredential) return alert('Browser មិនគាំទ្រទេ');
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: "Finance App" },
              user: { id: new Uint8Array(16), name: "user", displayName: "User" },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }],
              timeout: 60000,
              authenticatorSelection: { userVerification: "required" }
            }
          });
          if (credential) {
            setIsBiometricEnabled(true);
            localStorage.setItem('biometric_enabled', 'true');
            alert('បានបើក Face ID/ក្រយៅដៃ រួចរាល់');
          }
        } catch (err) {
          alert('មិនអាចកំណត់បានទេ');
        }
      };

      const handleBiometricAuth = async () => {
        triggerHaptic();
        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({
            publicKey: { challenge, timeout: 60000, userVerification: "required" }
          });
          if (assertion) setIsLocked(false);
        } catch (err) {
          setPinError('ស្កែនមិនជោគជ័យ');
        }
      };

      const handleSetPin = (newPin) => {
        triggerHaptic();
        setSavedPin(newPin);
        if (newPin) {
          localStorage.setItem('app_pin', newPin);
        } else {
          localStorage.removeItem('app_pin');
          setIsLocked(false);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setReceiptImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAddTransaction = async (e) => {
        e.preventDefault();
        triggerHaptic();
        if (!title || !amount) return;

        setLoading(true);
        let finalAmount = parseFloat(amount);
        if (formCurrency === 'KHR') finalAmount = finalAmount / EXCHANGE_RATE;

        const newTx = {
          id: Date.now(),
          title,
          amount: parseFloat(finalAmount.toFixed(2)),
          type,
          category,
          wallet,
          receipt: receiptImage,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions(prev => [newTx, ...prev]);

        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(newTx),
            });
          } catch (err) { console.error(err); }
        }

        setTitle(''); setAmount(''); setReceiptImage(null); setShowForm(false); setLoading(false);
      };

      const handleDelete = async (id) => {
        triggerHaptic();
        setTransactions(prev => prev.filter(t => t.id !== id));
        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", id }),
            });
          } catch (err) { console.error(err); }
        }
      };

      const dateFilteredTransactions = useMemo(() => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        return transactions.filter(t => {
          if (timeFilter === 'all') return true;
          const txDate = new Date(t.date);
          const txYear = txDate.getFullYear();
          const txMonth = txDate.getMonth();

          if (timeFilter === 'thisMonth') {
            return txYear === currentYear && txMonth === currentMonth;
          }
          if (timeFilter === 'lastMonth') {
            const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            const lastMonthIndex = currentMonth === 0 ? 11 : currentMonth - 1;
            return txYear === lastMonthYear && txMonth === lastMonthIndex;
          }
          return true;
        });
      }, [transactions, timeFilter]);

      const totalIncomeUSD = useMemo(() => {
        return dateFilteredTransactions.filter(t => t.type === 'income').reduce((a, c) => a + c.amount, 0);
      }, [dateFilteredTransactions]);

      const totalExpenseUSD = useMemo(() => {
        return dateFilteredTransactions.filter(t => t.type === 'expense').reduce((a, c) => a + c.amount, 0);
      }, [dateFilteredTransactions]);

      const balanceUSD = useMemo(() => totalIncomeUSD - totalExpenseUSD, [totalIncomeUSD, totalExpenseUSD]);

      const walletBalances = useMemo(() => {
        return WALLETS.map(w => {
          const wIncome = transactions.filter(t => (t.wallet || 'លុយសុទ្ធ (Cash)') === w && t.type === 'income').reduce((a, c) => a + c.amount, 0);
          const wExpense = transactions.filter(t => (t.wallet || 'លុយសុទ្ធ (Cash)') === w && t.type === 'expense').reduce((a, c) => a + c.amount, 0);
          return { name: w, balance: wIncome - wExpense };
        });
      }, [transactions]);

      const formatMoney = useCallback((valInUSD) => {
        if (currency === 'KHR') return (valInUSD * EXCHANGE_RATE).toLocaleString('km-KH') + ' ៛';
        return '$' + valInUSD.toFixed(2);
      }, [currency]);

      useEffect(() => {
        if (activeTab !== 'analytics' || !chartRef.current) return;
        const expenses = dateFilteredTransactions.filter(t => t.type === 'expense');
        const categories = {};
        expenses.forEach(t => { categories[t.category] = (categories[t.category] || 0) + t.amount; });

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(categories).length ? Object.keys(categories) : ['គ្មានទិន្នន័យ'],
            datasets: [{
              data: Object.values(categories).length ? Object.values(categories) : [1],
              backgroundColor: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#64748B', '#06B6D4', '#84CC16']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, animation: { duration: 300 }, plugins: { legend: { position: 'bottom' } } }
        });
      }, [dateFilteredTransactions, activeTab]);

      const finalDisplayTransactions = useMemo(() => {
        return dateFilteredTransactions.filter(t => {
          const matchesSearch = t.title.toLowerCase().includes(search.toLowerCase()) || 
                                t.category.toLowerCase().includes(search.toLowerCase());
          const matchesCategory = selectedCategoryFilter === 't.category === selectedCategoryFilter;
          return matchesSearch && matchesCategory;
        });
      }, [dateFilteredTransactions, search, selectedCategoryFilter]);

      if (showSplash) {
        return (
          <div class="h-full w-full flex flex-col items-center justify-center bg-slate-900 text-white fixed inset-0 z-50 pt-safe">
            <div class="w-40 h-40 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 flex items-center justify-center animate-pulse">
              <img src="https://lh3.googleusercontent.com/d/1yak4qUpNBbl-RFSSSd5ra8hz_Ladgztc" alt="Splash Logo" class="w-full h-full object-cover" />
            </div>
            <p class="text-slate-400 text-sm mt-4 font-medium tracking-wide">MY-FINANCE-PRO</p>
          </div>
        );
      }

      if (isLocked) {
        return (
          <div class="h-full flex flex-col items-center justify-center p-6 bg-slate-900 text-white pt-safe">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mb-6">
              <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">បញ្ចូលលេខកូដ PIN</h2>
            <p class="text-slate-400 text-sm mb-6">ដើម្បីចូលប្រើប្រាស់កម្មវិធី</p>

            <form onSubmit={handleUnlock} class="w-full max-w-xs flex flex-col items-center">
              <input 
                type="password" 
                maxLength="6"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}
                placeholder="••••"
                class="w-full text-center text-3xl tracking-widest bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                autoFocus
              />
              {pinError && <p class="text-red-400 text-xs mb-4">{pinError}</p>}
              <button type="submit" class="btn-active w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition shadow-lg">
                បើកសោ
              </button>
            </form>

            {isBiometricEnabled && (
              <button onClick={handleBiometricAuth} class="btn-active mt-6 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm py-2 px-4 rounded-lg bg-slate-800/50">
                <i data-lucide="scan-face" class="w-5 h-5"></i>
                <span>ប្រើប្រាស់ Face ID / ក្រយៅដៃ</span>
              </button>
            )}
          </div>
        );
      }

      return (
        <div class="flex flex-col h-full max-w-md mx-auto bg-[#F8FAFC] dark:bg-slate-900 border-x border-slate-200 dark:border-slate-800 relative shadow-2xl pt-safe">
          
          <main class="flex-1 overflow-y-auto ios-scroll p-4 pb-40 space-y-4 no-scrollbar">
            
            {activeTab === 'home' && (
              <>
                <div class="bg-gradient-to-br from-[#0F172A] via-[#1E1B4B] to-[#311042] text-white p-5 rounded-3xl shadow-xl space-y-4">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-1.5 text-xs text-slate-300">
                      <i data-lucide="shield-check" class="w-4 h-4 text-blue-400"></i>
                      <span>សមតុល្យសរុប</span>
                    </div>

                    <div class="flex items-center gap-2">
                      <select 
                        value={timeFilter} 
                        onChange={(e) => { triggerHaptic(); setTimeFilter(e.target.value); }}
                        class="h-[20px] px-2.5 text-5px font-bold bg-white/10 rounded-lg text-white border-white/20 focus:outline-none text-center">
                        <option value="all" class="bg-slate-900 text-white">ទាំងអស់</option>
                        <option value="thisMonth" class="bg-slate-900 text-white">ខែនេះ</option>
                        <option value="lastMonth" class="bg-slate-900 text-white">ខែមុន</option>
                      </select>

                      <button 
                        onClick={() => { triggerHaptic(); setCurrency(c => c === 'USD' ? 'KHR' : 'USD'); }}
                        class="btn-active h-[20px] px-3 text-xs font-bold bg-white/20 rounded-lg text-white text-center flex items-center justify-center">
                        {currency}
                      </button>
                    </div>
                  </div>

                  <div>
                    <h2 class="text-3xl font-extrabold tracking-tight mt-1">{formatMoney(balanceUSD)}</h2>
                    <p class="text-xs text-slate-400 mt-0.5">គណនីចម្បង • ប្រព័ន្ធគ្រប់គ្រងហិរញ្ញវត្ថុ</p>
                  </div>

                  <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10">
                    <div class="bg-white/5 p-3 rounded-2xl flex items-center gap-2.5 border border-white/5">
                      <div class="p-2 bg-emerald-500/20 text-emerald-400 rounded-xl">
                        <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                      </div>
                      <div>
                        <p class="text-[10px] text-slate-400">ចំណូលសរុប</p>
                        <p class="text-sm font-bold text-emerald-400">+{formatMoney(totalIncomeUSD)}</p>
                      </div>
                    </div>

                    <div class="bg-white/5 p-3 rounded-2xl flex items-center gap-2.5 border border-white/5">
                      <div class="p-2 bg-rose-500/20 text-rose-400 rounded-xl">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                      </div>
                      <div>
                        <p class="text-[10px] text-slate-400">ចំណាយសរុប</p>
                        <p class="text-sm font-bold text-rose-400">-{formatMoney(totalExpenseUSD)}</p>
                      </div>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">កាតាបប្រាក់របស់អ្នក</h3>
                  <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                    {walletBalances.map((w, idx) => (
                      <div key={idx} class="min-w-[130px] bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 flex-shrink-0 shadow-sm">
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium truncate">{w.name}</p>
                        <p class="text-sm font-bold mt-1.5 text-slate-800 dark:text-slate-100">{formatMoney(w.balance)}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div class="space-y-2.5">
                  <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                    <input 
                      type="text" 
                      placeholder="ស្វែងរកប្រវត្តិប្រតិបត្តិការ..." 
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      class="w-full bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                    />
                  </div>

                  <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
                    {['ទាំងអស់', ...CATEGORIES].map((cat, idx) => (
                      <button
                        key={idx}
                        onClick={() => { triggerHaptic(); setSelectedCategoryFilter(cat); }}
                        class={`btn-active px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm ${selectedCategoryFilter === cat ? 'bg-blue-600 text-white shadow-blue-600/20' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700'}`}>
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div class="space-y-2">
                  <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">ប្រវត្តិប្រតិបត្តិការ</h3>
                    <span class="text-xs text-slate-400 font-medium">{finalDisplayTransactions.length} បេនប្រតិបត្តិការ</span>
                  </div>

                  {finalDisplayTransactions.length === 0 ? (
                    <div class="text-center py-8 text-slate-400 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
                      <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                      <p class="text-xs">មិនទាន់មានទិន្នន័យឡើយ</p>
                    </div>
                  ) : (
                    finalDisplayTransactions.map(t => (
                      <div key={t.id} class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                          <div class={`w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm ${t.type === 'income' ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                            <i data-lucide={t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'} class="w-5 h-5"></i>
                          </div>
                          <div>
                            <div class="flex items-center gap-1.5">
                              <h4 class="font-semibold text-sm text-slate-800 dark:text-slate-100">{t.title}</h4>
                              {t.receipt && (
                                <button onClick={() => setSelectedReceipt(t.receipt)} class="btn-active text-blue-500">
                                  <i data-lucide="image" class="w-3.5 h-3.5"></i>
                                </button>
                              )}
                            </div>
                            <div class="flex items-center gap-2 text-[11px] text-slate-400 mt-0.5">
                              <span>{t.category}</span>
                              <span>•</span>
                              <span>{t.wallet || 'Cash'}</span>
                              <span>•</span>
                              <span>{t.date}</span>
                            </div>
                          </div>
                        </div>

                        <div class="text-right flex items-center gap-3">
                          <span class={`font-bold text-sm ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>
                            {t.type === 'income' ? '+' : '-'}{formatMoney(t.amount)}
                          </span>
                          <button onClick={() => handleDelete(t.id)} class="btn-active text-slate-300 hover:text-red-500 p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </>
            )}

            {activeTab === 'analytics' && (
              <div class="space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm">
                  <h3 class="font-bold text-sm mb-4 text-slate-800 dark:text-slate-100">ការភាគរយនៃការចំណាយតាមប្រភេទ</h3>
                  <div class="h-64 relative">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-3">
                  <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-blue-500"></i>
                    កំណត់ថវិកាតាមប្រភេទ (Category Budgets)
                  </h3>

                  <div class="space-y-3 pt-2">
                    {CATEGORIES.slice(0, 4).map(cat => {
                      const catSpent = dateFilteredTransactions
                        .filter(t => t.type === 'expense' && t.category === cat)
                        .reduce((a, c) => a + c.amount, 0);
                      const limit = categoryBudgets[cat] || 100;
                      const pct = Math.min((catSpent / limit) * 100, 100);

                      return (
                        <div key={cat} class="space-y-1">
                          <div class="flex justify-between text-xs font-medium">
                            <span>{cat}</span>
                            <span class={catSpent > limit ? "text-red-500 font-bold" : "text-slate-500"}>
                              ${catSpent.toFixed(2)} / ${limit}
                            </span>
                          </div>
                          <div class="w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div class={`h-full ${catSpent > limit ? 'bg-red-500' : 'bg-blue-500'}`} style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'features' && (
              <div class="space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-2.5">
                  <div class="flex justify-between items-center text-xs">
                    <span class="font-semibold text-slate-600 dark:text-slate-300">កម្រិតថវិកាចំណាយ (Monthly Budget)</span>
                    <span class="font-bold text-blue-600 dark:text-blue-400">
                      ${totalExpenseUSD.toFixed(2)} / ${budgetLimit}
                    </span>
                  </div>
                  <div class="w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div 
                      class={`h-full ${totalExpenseUSD > budgetLimit ? 'bg-red-500' : 'bg-blue-600'}`}
                      style={{ width: `${Math.min((totalExpenseUSD / (budgetLimit || 1)) * 100, 100)}%` }}>
                    </div>
                  </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-3">
                  <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="target" class="w-4 h-4 text-emerald-500"></i>
                    គោលដៅសន្សំប្រាក់ (Savings Goals)
                  </h3>

                  <div class="space-y-3 pt-2">
                    {savingsGoals.map(g => {
                      const pct = Math.min((g.current / g.target) * 100, 100);
                      return (
                        <div key={g.id} class="bg-slate-50 dark:bg-slate-700/50 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2">
                          <div class="flex justify-between items-center text-xs">
                            <span class="font-bold">{g.title}</span>
                            <span class="text-emerald-500 font-semibold">${g.current} / ${g.target} ({pct.toFixed(0)}%)</span>
                          </div>
                          <div class="w-full h-2 bg-slate-200 dark:bg-slate-600 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500" style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div class="space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i data-lucide={darkMode ? "sun" : "moon"} class="w-4 h-4 text-blue-500"></i>
                    <span class="font-bold text-sm text-slate-800 dark:text-slate-100">ម៉ូតងងឹត (Dark Mode)</span>
                  </div>
                  <button 
                    onClick={() => { triggerHaptic(); setDarkMode(!darkMode); }}
                    class={`btn-active w-12 h-6 flex items-center rounded-full p-1 ${darkMode ? 'bg-blue-600' : 'bg-slate-300'}`}>
                    <div class={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${darkMode ? 'translate-x-6' : 'translate-x-0'}`}></div>
                  </button>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-3">
                  <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">សុវត្ថិភាព (PIN Code & Biometrics)</h3>
                  <div class="flex gap-2">
                    <button 
                      onClick={() => {
                        const pin = prompt('បញ្ចូលលេខកូដ PIN ថ្មី៖');
                        if (pin !== null) handleSetPin(pin);
                      }}
                      class="btn-active flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow-sm">
                      {savedPin ? 'ផ្លាស់ប្ដូរ PIN' : 'កំណត់លេខ PIN'}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          <nav class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center px-4 pt-3 pb-safe fixed bottom-0 left-0 right-0 max-w-md mx-auto z-10 shadow-lg">
            <button 
              onClick={() => { triggerHaptic(); setActiveTab('home'); }}
              class={`btn-active flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-400 font-normal'}`}>
              <i data-lucide="home" class="w-5 h-5"></i>
              <span class="text-[11px]">ទំព័រដើម</span>
            </button>

            <button 
              onClick={() => { triggerHaptic(); setActiveTab('analytics'); }}
              class={`btn-active flex flex-col items-center gap-1 ${activeTab === 'analytics' ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-400 font-normal'}`}>
              <i data-lucide="pie-chart" class="w-5 h-5"></i>
              <span class="text-[11px]">វិភាគ</span>
            </button>

            <div class="relative -top-4">
              <button 
                onClick={() => { triggerHaptic(); setShowForm(true); }}
                class="btn-active w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-xl shadow-blue-600/30">
                <i data-lucide="plus" class="w-6 h-6"></i>
              </button>
            </div>

            <button 
              onClick={() => { triggerHaptic(); setActiveTab('features'); }}
              class={`btn-active flex flex-col items-center gap-1 ${activeTab === 'features' ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-400 font-normal'}`}>
              <i data-lucide="sparkles" class="w-5 h-5"></i>
              <span class="text-[11px]">មុខងារ</span>
            </button>

            <button 
              onClick={() => { triggerHaptic(); setActiveTab('settings'); }}
              class={`btn-active flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-400 font-normal'}`}>
              <i data-lucide="settings" class="w-5 h-5"></i>
              <span class="text-[11px]">ការកំណត់</span>
            </button>
          </nav>

          {showForm && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
              <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                  <h3 class="font-bold text-base text-slate-800 dark:text-slate-100">បន្ថែមប្រតិបត្តិការ</h3>
                  <button onClick={() => setShowForm(false)} class="btn-active text-slate-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddTransaction} class="space-y-4">
                  <div class="flex bg-slate-100 dark:bg-slate-700 p-1 rounded-2xl text-xs font-bold">
                    <button 
                      type="button"
                      onClick={() => { triggerHaptic(); setType('expense'); }}
                      class={`btn-active flex-1 py-2.5 rounded-xl ${type === 'expense' ? 'bg-rose-500 text-white shadow' : 'text-slate-500'}`}>
                      ចំណាយ
                    </button>
                    <button 
                      type="button"
                      onClick={() => { triggerHaptic(); setType('income'); }}
                      class={`btn-active flex-1 py-2.5 rounded-xl ${type === 'income' ? 'bg-emerald-500 text-white shadow' : 'text-slate-500'}`}>
                      ចំណូល
                    </button>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">បរិយាយ / ឈ្មោះប្រតិបត្តិការ</label>
                    <input 
                      type="text" 
                      required
                      placeholder="ឧ. ទិញកាហ្វេ, បង់ថ្លៃផ្ទះ"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                      <label class="block text-xs font-semibold text-slate-500 mb-1">ចំនួនទឹកប្រាក់</label>
                      <input 
                        type="number" 
                        step="0.01"
                        required
                        placeholder="0.00"
                        value={amount}
                        onChange={(e) => setAmount(e.target.value)}
                        class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-500 mb-1">រូបិយវត្ថុ</label>
                      <select value={formCurrency} onChange={(e) => setFormCurrency(e.target.value)} class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-2xl px-2 py-3 text-xs font-semibold">
                        <option value="USD">USD ($)</option>
                        <option value="KHR">KHR (៛)</option>
                      </select>
                    </div>
                  </div>

                  <button type="submit" disabled={loading} class="btn-active w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                    {loading ? <i data-lucide="refresh-cw" class="w-5 h-5 animate-spin"></i> : <span>រក្សាទុកទិន្នន័យ</span>}
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
