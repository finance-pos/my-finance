<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>កម្មវិធីគ្រប់គ្រងហិរញ្ញវត្ថុ</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Mobile & iOS Home Screen Icons (ភ្ជាប់ទៅរូបទី២) -->
  <link rel="icon" type="image/png" href="iconfinances.png">
  <link rel="apple-touch-icon" href="iconfinances.png">
  
  <!-- Config សម្រាប់ទូរស័ព្ទ iOS & Android ឱ្យដើរ Fullscreen ដូច App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ហិរញ្ញវត្ថុ">
  <meta name="theme-color" content="#1D4ED8">

  <!-- Font ខ្មែរ Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Kantumruy Pro"', 'sans-serif'] },
          colors: { pureBlue: '#1D4ED8' }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-20">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ⚠️ ដាក់ Web App URL របស់ Google Apps Script ត្រង់នេះ ⚠️
    const GOOGLE_SHEET_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
    const EXCHANGE_RATE = 4100;

    const CATEGORIES = [
      'ម្ហូបអាហារ', 'ធ្វើដំណើរ/ថ្លៃសាំង', 'ការងារ/ប្រាក់ខែ', 
      'ការកម្សាន្ត', 'ការសិក្សា', 'ទិញអីវ៉ាន់/សម្ភារៈ', 
      'ផ្ទះ/ទឹកភ្លើង', 'សុខភាព', 'ទូទៅ'
    ];

    function App() {
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      
      const [activeTab, setActiveTab] = useState('home');
      const [timeFilter, setTimeFilter] = useState('thisMonth');
      const [search, setSearch] = useState('');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ទាំងអស់');
      const [currency, setCurrency] = useState('USD');
      const [budgetLimit, setBudgetLimit] = useState(() => localStorage.getItem('budgetLimit') || 500);
      const [tempBudget, setTempBudget] = useState(budgetLimit);

      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [formCurrency, setFormCurrency] = useState('USD');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState(CATEGORIES[0]);
      const [showForm, setShowForm] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const fetchData = async () => {
        if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) return;
        setSyncing(true);
        try {
          const res = await fetch(GOOGLE_SHEET_URL);
          const data = await res.json();
          if (Array.isArray(data)) setTransactions(data.reverse());
        } catch (err) {
          console.error("Fetch Error:", err);
        }
        setSyncing(false);
      };

      useEffect(() => { fetchData(); }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [transactions, showForm, activeTab, currency, selectedCategoryFilter, timeFilter, syncing]);

      const handleAddTransaction = async (e) => {
        e.preventDefault();
        if (!title || !amount) return;

        setLoading(true);
        let finalAmount = parseFloat(amount);
        if (formCurrency === 'KHR') finalAmount = finalAmount / EXCHANGE_RATE;

        const newTx = {
          id: Date.now(),
          title,
          amount: parseFloat(finalAmount.toFixed(2)),
          type,
          category,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions([newTx, ...transactions]);

        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(newTx),
            });
          } catch (err) { console.error("Save Error:", err); }
        }

        setTitle(''); setAmount(''); setShowForm(false); setLoading(false);
      };

      const handleDelete = async (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", id }),
            });
          } catch (err) { console.error("Delete Error:", err); }
        }
      };

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      const dateFilteredTransactions = transactions.filter(t => {
        if (timeFilter === 'all') return true;
        const txDate = new Date(t.date);
        const txYear = txDate.getFullYear();
        const txMonth = txDate.getMonth();

        if (timeFilter === 'thisMonth') {
          return txYear === currentYear && txMonth === currentMonth;
        }

        if (timeFilter === 'lastMonth') {
          const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
          const lastMonthIndex = currentMonth === 0 ? 11 : currentMonth - 1;
          return txYear === lastMonthYear && txMonth === lastMonthIndex;
        }

        return true;
      });

      const totalIncomeUSD = dateFilteredTransactions.filter(t => t.type === 'income').reduce((a, c) => a + c.amount, 0);
      const totalExpenseUSD = dateFilteredTransactions.filter(t => t.type === 'expense').reduce((a, c) => a + c.amount, 0);
      const balanceUSD = totalIncomeUSD - totalExpenseUSD;

      const formatMoney = (valInUSD) => {
        if (currency === 'KHR') return (valInUSD * EXCHANGE_RATE).toLocaleString('km-KH') + ' ៛';
        return '$' + valInUSD.toFixed(2);
      };

      const exportToCSV = () => {
        let csv = "ID,Title,Amount(USD),Type,Category,Date\n";
        dateFilteredTransactions.forEach(t => {
          csv += `"${t.id}","${t.title}","${t.amount}","${t.type}","${t.category}","${t.date}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Financial_Report_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      useEffect(() => {
        if (activeTab !== 'analytics' || !chartRef.current) return;
        const expenses = dateFilteredTransactions.filter(t => t.type === 'expense');
        const categories = {};
        expenses.forEach(t => { categories[t.category] = (categories[t.category] || 0) + t.amount; });

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(categories).length ? Object.keys(categories) : ['គ្មានទិន្នន័យ'],
            datasets: [{
              data: Object.values(categories).length ? Object.values(categories) : [1],
              backgroundColor: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#64748B', '#06B6D4', '#84CC16']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }, [dateFilteredTransactions, activeTab]);

      const finalDisplayTransactions = dateFilteredTransactions.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(search.toLowerCase()) || 
                              t.category.toLowerCase().includes(search.toLowerCase());
        const matchesCategory = selectedCategoryFilter === '
