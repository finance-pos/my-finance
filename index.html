<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>កម្មវិធីគ្រប់គ្រងហិរញ្ញវត្ថុ Pro</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Mobile & iOS Home Screen Icons -->
  <link rel="icon" type="image/png" href="iconfinances.png">
  <link rel="apple-touch-icon" href="iconfinances.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ហិរញ្ញវត្ថុ">
  <meta name="theme-color" content="#1D4ED8">

  <!-- Font ខ្មែរ Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Kantumruy Pro"', 'sans-serif'] },
          colors: { pureBlue: '#1D4ED8' }
        }
      }
    }
  </script>

  <!-- React, Babel & Libraries CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 font-sans min-h-screen text-slate-800 dark:text-slate-100 pb-20 transition-colors duration-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GOOGLE_SHEET_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
    const EXCHANGE_RATE = 4100;

    const CATEGORIES = [
      'ម្ហូបអាហារ', 'ធ្វើដំណើរ/ថ្លៃសាំង', 'ការងារ/ប្រាក់ខែ', 
      'ការកម្សាន្ត', 'ការសិក្សា', 'ទិញអីវ៉ាន់/សម្ភារៈ', 
      'ផ្ទះ/ទឹកភ្លើង', 'សុខភាព', 'ទូទៅ'
    ];

    const WALLETS = ['លុយសុទ្ធ (Cash)', 'ABA Bank', 'ACLEDA Bank', 'ផ្សេងៗ'];

    function App() {
      // PIN Security States
      const [savedPin, setSavedPin] = useState(() => localStorage.getItem('app_pin') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('app_pin'));
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      // Theme State
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('dark_mode') === 'true');

      // App States
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      
      const [activeTab, setActiveTab] = useState('home');
      const [timeFilter, setTimeFilter] = useState('thisMonth');
      const [search, setSearch] = useState('');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ទាំងអស់');
      const [currency, setCurrency] = useState('USD');
      const [budgetLimit, setBudgetLimit] = useState(() => parseFloat(localStorage.getItem('budgetLimit')) || 500);
      const [tempBudget, setTempBudget] = useState(budgetLimit);

      // Form States
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [formCurrency, setFormCurrency] = useState('USD');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState(CATEGORIES[0]);
      const [wallet, setWallet] = useState(WALLETS[0]);
      const [showForm, setShowForm] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Handle Dark Mode Toggle
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('dark_mode', darkMode);
      }, [darkMode]);

      // Fetch Data
      const fetchData = async () => {
        if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) return;
        setSyncing(true);
        try {
          const res = await fetch(GOOGLE_SHEET_URL);
          const data = await res.json();
          if (Array.isArray(data)) setTransactions(data.reverse());
        } catch (err) {
          console.error("Fetch Error:", err);
        }
        setSyncing(false);
      };

      useEffect(() => { fetchData(); }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [transactions, showForm, activeTab, currency, selectedCategoryFilter, timeFilter, syncing, isLocked, darkMode]);

      // PIN Lock Verification
      const handleUnlock = (e) => {
        e.preventDefault();
        if (pinInput === savedPin) {
          setIsLocked(false);
          setPinError('');
          setPinInput('');
        } else {
          setPinError('លេខកូដមិនត្រឹមត្រូវឡើយ!');
          setPinInput('');
        }
      };

      const handleSetPin = (newPin) => {
        setSavedPin(newPin);
        if (newPin) {
          localStorage.setItem('app_pin', newPin);
        } else {
          localStorage.removeItem('app_pin');
          setIsLocked(false);
        }
      };

      // Add Transaction
      const handleAddTransaction = async (e) => {
        e.preventDefault();
        if (!title || !amount) return;

        setLoading(true);
        let finalAmount = parseFloat(amount);
        if (formCurrency === 'KHR') finalAmount = finalAmount / EXCHANGE_RATE;

        const newTx = {
          id: Date.now(),
          title,
          amount: parseFloat(finalAmount.toFixed(2)),
          type,
          category,
          wallet,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions([newTx, ...transactions]);

        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(newTx),
            });
          } catch (err) { console.error("Save Error:", err); }
        }

        setTitle(''); setAmount(''); setShowForm(false); setLoading(false);
      };

      const handleDelete = async (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          try {
            await fetch(GOOGLE_SHEET_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", id }),
            });
          } catch (err) { console.error("Delete Error:", err); }
        }
      };

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      const dateFilteredTransactions = transactions.filter(t => {
        if (timeFilter === 'all') return true;
        const txDate = new Date(t.date);
        const txYear = txDate.getFullYear();
        const txMonth = txDate.getMonth();

        if (timeFilter === 'thisMonth') {
          return txYear === currentYear && txMonth === currentMonth;
        }

        if (timeFilter === 'lastMonth') {
          const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
          const lastMonthIndex = currentMonth === 0 ? 11 : currentMonth - 1;
          return txYear === lastMonthYear && txMonth === lastMonthIndex;
        }

        return true;
      });

      const totalIncomeUSD = dateFilteredTransactions.filter(t => t.type === 'income').reduce((a, c) => a + c.amount, 0);
      const totalExpenseUSD = dateFilteredTransactions.filter(t => t.type === 'expense').reduce((a, c) => a + c.amount, 0);
      const balanceUSD = totalIncomeUSD - totalExpenseUSD;

      const formatMoney = (valInUSD) => {
        if (currency === 'KHR') return (valInUSD * EXCHANGE_RATE).toLocaleString('km-KH') + ' ៛';
        return '$' + valInUSD.toFixed(2);
      };

      // Export CSV
      const exportToCSV = () => {
        let csv = "ID,Title,Amount(USD),Type,Category,Wallet,Date\n";
        dateFilteredTransactions.forEach(t => {
          csv += `"${t.id}","${t.title}","${t.amount}","${t.type}","${t.category}","${t.wallet || 'លុយសុទ្ធ'}","${t.date}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Financial_Report_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      // Export PDF (Print Mode)
      const exportToPDF = () => {
        window.print();
      };

      // Analytics Chart
      useEffect(() => {
        if (activeTab !== 'analytics' || !chartRef.current) return;
        const expenses = dateFilteredTransactions.filter(t => t.type === 'expense');
        const categories = {};
        expenses.forEach(t => { categories[t.category] = (categories[t.category] || 0) + t.amount; });

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(categories).length ? Object.keys(categories) : ['គ្មានទិន្នន័យ'],
            datasets: [{
              data: Object.values(categories).length ? Object.values(categories) : [1],
              backgroundColor: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#64748B', '#06B6D4', '#84CC16']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }, [dateFilteredTransactions, activeTab]);

      const finalDisplayTransactions = dateFilteredTransactions.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(search.toLowerCase()) || 
                              t.category.toLowerCase().includes(search.toLowerCase());
        const matchesCategory = selectedCategoryFilter === 'ទាំងអស់' || t.category === selectedCategoryFilter;
        return matchesSearch && matchesCategory;
      });

      const isOverBudget = totalExpenseUSD > budgetLimit;
      const isNearBudget = totalExpenseUSD >= (budgetLimit * 0.8) && !isOverBudget;
      const budgetPercent = Math.min((totalExpenseUSD / budgetLimit) * 100, 100);

      // PIN Screen Component
      if (isLocked) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white">
            <div className="bg-slate-800 p-6 rounded-3xl w-full max-w-xs shadow-2xl border border-slate-700 text-center space-y-4">
              <div className="w-12 h-12 bg-pureBlue/20 text-pureBlue rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="lock" className="w-6 h-6"></i>
              </div>
              <h2 className="text-base font-bold">បញ្ចូលលេខកូដសម្ងាត់</h2>
              <form onSubmit={handleUnlock} className="space-y-3">
                <input 
                  type="password" maxLength="4" value={pinInput} onChange={(e) => setPinInput(e.target.value)}
                  placeholder="• • • •" className="w-full text-center text-2xl tracking-widest p-2 bg-slate-700 border border-slate-600 rounded-xl outline-none focus:border-pureBlue" autoFocus
                />
                {pinError && <div className="text-rose-400 text-xs">{pinError}</div>}
                <button type="submit" className="w-full bg-pureBlue py-2.5 rounded-xl font-bold text-xs shadow hover:bg-blue-700 transition">
                  ដោះកូដ
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="w-full max-w-md mx-auto min-h-screen flex flex-col justify-between">
          <div className="p-3 space-y-3">

            {/* Smart Alerts */}
            {isOverBudget && (
              <div className="bg-rose-500 text-white text-xs p-3 rounded-2xl flex items-center gap-2 shadow-md animate-pulse">
                <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>
                <div>
                  <strong>ប្រកាសអាសន្ន!</strong> អ្នកបានចំណាយលើសពិដានថវិកាប្រចាំខែ (${budgetLimit}) ហើយ!
                </div>
              </div>
            )}

            {isNearBudget && (
              <div className="bg-amber-500 text-white text-xs p-3 rounded-2xl flex items-center gap-2 shadow-md">
                <i data-lucide="alert-circle" className="w-5 h-5 flex-shrink-0"></i>
                <div>
                  <strong>ព្រមាន!</strong> អ្នកបានចំណាយអស់ ៨០% នៃពិដានថវិកាហើយ!
                </div>
              </div>
            )}

            {activeTab === 'home' && (
              <div className="space-y-3">
                <div className="bg-pureBlue text-white rounded-3xl p-5 shadow-lg space-y-4 relative">
                  <div className="flex justify-between items-center">
                    <select 
                      value={timeFilter} 
                      onChange={(e) => setTimeFilter(e.target.value)}
                      className="bg-white/15 text-white border border-white/20 rounded-xl px-2.5 py-1 text-[11px] font-semibold outline-none backdrop-blur-md cursor-pointer hover:bg-white/25 transition"
                    >
                      <option value="thisMonth" className="text-slate-800">📅 ខែនេះ</option>
                      <option value="lastMonth" className="text-slate-800">⏮️ ខែមុន</option>
                      <option value="all" className="text-slate-800">🌐 ទាំងអស់</option>
                    </select>

                    <button onClick={fetchData} className="text-blue-200 hover:text-white p-1 transition" title="Sync ទិន្នន័យ">
                      <i data-lucide="refresh-cw" className={`w-4 h-4 ${syncing ? 'animate-spin text-white' : ''}`}></i>
                    </button>
                  </div>

                  <div className="text-center space-y-1 pt-1">
                    <span className="text-[11px] text-blue-200 font-light">
                      {timeFilter === 'thisMonth' ? 'ប្រាក់នៅសល់ (ខែនេះ)' : timeFilter === 'lastMonth' ? 'ប្រាក់នៅសល់ (ខែមុន)' : 'ប្រាក់នៅសល់សរុប'}
                    </span>
                    <div className="text-3xl font-extrabold">{formatMoney(balanceUSD)}</div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-blue-400/30">
                    <div className="bg-white/10 p-2.5 rounded-2xl flex items-center gap-2">
                      <i data-lucide="arrow-up-circle" className="w-5 h-5 text-emerald-300"></i>
                      <div>
                        <div className="text-[10px] text-blue-100">ចំណូល</div>
                        <div className="text-xs font-bold text-emerald-300">+{formatMoney(totalIncomeUSD)}</div>
                      </div>
                    </div>

                    <div className="bg-white/10 p-2.5 rounded-2xl flex items-center gap-2">
                      <i data-lucide="arrow-down-circle" className="w-5 h-5 text-rose-300"></i>
                      <div>
                        <div className="text-[10px] text-blue-100">ចំណាយ</div>
                        <div className="text-xs font-bold text-rose-300">-{formatMoney(totalExpenseUSD)}</div>
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => setShowForm(!showForm)}
                  className="w-full bg-pureBlue text-white py-3 rounded-2xl text-xs font-semibold hover:bg-blue-800 transition shadow flex justify-center items-center gap-2"
                >
                  <i data-lucide={showForm ? "x-circle" : "plus-circle"} className="w-4 h-4"></i>
                  {showForm ? 'បិទទម្រង់' : 'បន្ថែមចំណូល / ចំណាយ'}
                </button>

                {showForm && (
                  <form onSubmit={handleAddTransaction} className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-600 dark:text-slate-300 mb-1">បរិយាយ</label>
                      <input 
                        type="text" value={title} onChange={(e) => setTitle(e.target.value)}
                        placeholder="ឧ. ទិញបាយ, ប្រាក់ខែ" className="w-full p-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none focus:border-pureBlue" required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-600 dark:text-slate-300 mb-1">ចំនួនទឹកប្រាក់</label>
                        <input 
                          type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)}
                          placeholder="0.00" className="w-full p-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none focus:border-pureBlue" required
                        />
                      </div>
                      <div>
                        <label className="block text-slate-600 dark:text-slate-300 mb-1">រូបិយប័ណ្ណ</label>
                        <select value={formCurrency} onChange={(e) => setFormCurrency(e.target.value)} className="w-full p-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none">
                          <option value="USD">$ USD</option>
                          <option value="KHR">៛ KHR</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="block text-slate-600 dark:text-slate-300 mb-1">ប្រភេទ</label>
                        <select value={type} onChange={(e) => setType(e.target.value)} className="w-full p-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none">
                          <option value="expense">ចំណាយ (-)</option>
                          <option value="income">ចំណូល (+)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-600 dark:text-slate-300 mb-1">ជំពូក</label>
                        <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none">
                          {CATEGORIES.map((cat, idx) => <option key={idx} value={cat}>{cat}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-600 dark:text-slate-300 mb-1">កាបូបលុយ</label>
                        <select value={wallet} onChange={(e) => setWallet(e.target.value)} className="w-full p-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl outline-none">
                          {WALLETS.map((w, idx) => <option key={idx} value={w}>{w}</option>)}
                        </select>
                      </div>
                    </div>

                    <button type="submit" disabled={loading} className="w-full bg-pureBlue text-white py-2.5 rounded-xl font-medium text-xs mt-2">
                      {loading ? 'កំពុងរក្សាទុក...' : 'រក្សាទុក'}
                    </button>
                  </form>
                )}

                <div className="flex gap-2">
                  <input 
                    type="text" value={search} onChange={(e) => setSearch(e.target.value)}
                    placeholder="ស្វែងរកប្រវត្តិ..." 
                    className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none shadow-sm"
                  />
                  <select 
                    value={selectedCategoryFilter} onChange={(e) => setSelectedCategoryFilter(e.target.value)}
                    className="p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none shadow-sm"
                  >
                    <option value="ទាំងអស់">ទាំងអស់</option>
                    {CATEGORIES.map((cat, idx) => <option key={idx} value={cat}>{cat}</option>)}
                  </select>
                </div>

                <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                  <div className="p-3 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-100 dark:border-slate-700 font-bold text-xs flex justify-between">
                    <span>ប្រវត្តិប្រតិបត្តិការ</span>
                    <span className="text-[10px] text-slate-400 font-normal">({finalDisplayTransactions.length} ប្រតិបត្តិការ)</span>
                  </div>
                  <div className="divide-y divide-slate-100 dark:divide-slate-700 max-h-96 overflow-y-auto">
                    {finalDisplayTransactions.length === 0 ? (
                      <div className="p-6 text-center text-slate-400 text-xs">មិនមានទិន្នន័យក្នុងកំឡុងពេលនេះឡើយ</div>
                    ) : (
                      finalDisplayTransactions.map((t) => (
                        <div key={t.id} className="p-3 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                          <div className="flex items-center gap-2.5">
                            <div className={`p-1.5 rounded-lg ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400' : 'bg-rose-50 text-rose-600 dark:bg-rose-950 dark:text-rose-400'}`}>
                              <i data-lucide={t.type === 'income' ? 'arrow-up-circle' : 'arrow-down-circle'} className="w-4 h-4"></i>
                            </div>
                            <div>
                              <div className="font-semibold text-xs">{t.title}</div>
                              <div className="text-[10px] text-slate-400">{t.category} • <span className="text-pureBlue font-medium">{t.wallet || 'លុយសុទ្ធ'}</span> • {t.date}</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`font-bold text-xs ${t.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : ''}`}>
                              {t.type === 'income' ? '+' : '-'}{formatMoney(t.amount)}
                            </span>
                            <button onClick={() => handleDelete(t.id)} className="text-slate-300 hover:text-rose-600 transition">
                              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="space-y-3">
                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold">ការបែងចែកចំណាយតាមប្រភេទ</h3>
                    <span className="text-[10px] bg-blue-50 dark:bg-blue-900/40 text-pureBlue font-bold px-2 py-0.5 rounded-lg">
                      {timeFilter === 'thisMonth' ? 'ខែនេះ' : timeFilter === 'lastMonth' ? 'ខែមុន' : 'ទាំងអស់'}
                    </span>
                  </div>
                  <div className="h-52 relative">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold">ពិដានថវិកាប្រចាំខែ</span>
                  </div>

                  <div className="flex gap-2">
                    <input 
                      type="number" value={tempBudget} onChange={(e) => setTempBudget(e.target.value)}
                      className="p-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl text-xs w-full outline-none" placeholder="កំណត់ថវិកា ($)"
                    />
                    <button 
                      onClick={() => { setBudgetLimit(parseFloat(tempBudget)); localStorage.setItem('budgetLimit', tempBudget); }}
                      className="bg-pureBlue text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap"
                    >
                      រក្សាទុក
                    </button>
                  </div>

                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                    <div className={`h-full ${isOverBudget ? 'bg-rose-600' : isNearBudget ? 'bg-amber-500' : 'bg-pureBlue'}`} style={{ width: `${budgetPercent}%` }}></div>
                  </div>

                  <div className="flex justify-between text-[11px] text-slate-500 dark:text-slate-400">
                    <span>បានចំណាយ៖ {formatMoney(totalExpenseUSD)}</span>
                    <span>ពិដាន៖ ${budgetLimit}</span>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'tools' && (
              <div className="space-y-3">
                {/* Dark Mode Toggle */}
                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <i data-lucide={darkMode ? "moon" : "sun"} className="w-4 h-4 text-pureBlue"></i>
                    <span className="text-xs font-bold">ពន្លឺអេក្រង់ (Dark Mode)</span>
                  </div>
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="bg-slate-200 dark:bg-slate-700 p-1.5 rounded-xl text-xs font-bold"
                  >
                    {darkMode ? '🌙 ងងឹត' : '☀️ ភ្លឺ'}
                  </button>
                </div>

                {/* PIN Security */}
                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                  <div className="flex items-center gap-2">
                    <i data-lucide="shield-check" className="w-4 h-4 text-pureBlue"></i>
                    <span className="text-xs font-bold">សុវត្ថិភាពលេខកូដ (PIN Lock)</span>
                  </div>
                  <p className="text-[11px] text-slate-400">ការពារការចូលមើលទិន្នន័យដោយគ្មានការអនុញ្ញាត</p>
                  <div className="flex gap-2 pt-1">
                    <input 
                      type="password" maxLength="4" placeholder="កូដ ៤ ខ្ទង់" 
                      onChange={(e) => setPinInput(e.target.value)}
                      className="p-2 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl text-xs w-full outline-none text-center"
                    />
                    <button 
                      onClick={() => handleSetPin(pinInput)}
                      className="bg-pureBlue text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap"
                    >
                      {savedPin ? 'ប្តូរកូដ' : 'ដាក់កូដ'}
                    </button>
                    {savedPin && (
                      <button 
                        onClick={() => handleSetPin('')}
                        className="bg-rose-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap"
                      >
                        លុបកូដ
                      </button>
                    )}
                  </div>
                </div>

                {/* Currency Exchange */}
                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex justify-between items-center">
                  <span className="text-xs font-bold">រូបិយប័ណ្ណបង្ហាញ</span>
                  <button 
                    onClick={() => setCurrency(currency === 'USD' ? 'KHR' : 'USD')}
                    className="bg-pureBlue text-white font-bold px-3 py-1.5 rounded-xl text-xs"
                  >
                    {currency === 'USD' ? 'USD ($)' : 'KHR (៛)'}
                  </button>
                </div>

                {/* Export Data */}
                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                  <h3 className="text-xs font-bold mb-2">ទាញយករបាយការណ៍ (Export)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={exportToCSV} className="flex items-center justify-center gap-1.5 bg-emerald-600 text-white p-2.5 rounded-xl text-xs font-semibold hover:bg-emerald-700 transition">
                      <i data-lucide="file-text" className="w-4 h-4"></i> Excel (CSV)
                    </button>
                    <button onClick={exportToPDF} className="flex items-center justify-center gap-1.5 bg-rose-600 text-white p-2.5 rounded-xl text-xs font-semibold hover:bg-rose-700 transition">
                      <i data-lucide="printer" className="w-4 h-4"></i> Print (PDF)
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Navigation Bar */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-6 py-2 flex justify-between items-center shadow-lg z-50">
            <button 
              onClick={() => setActiveTab('home')} 
              className={`flex flex-col items-center gap-1 text-[11px] font-medium transition ${activeTab === 'home' ? 'text-pureBlue' : 'text-slate-400'}`}
            >
              <i data-lucide="home" className="w-5 h-5"></i>
              <span>ទំព័រដើម</span>
            </button>

            <button 
              onClick={() => setActiveTab('analytics')} 
              className={`flex flex-col items-center gap-1 text-[11px] font-medium transition ${activeTab === 'analytics' ? 'text-pureBlue' : 'text-slate-400'}`}
            >
              <i data-lucide="pie-chart" className="w-5 h-5"></i>
              <span>ការវិភាគ</span>
            </button>

            <button 
              onClick={() => setActiveTab('tools')} 
              className={`flex flex-col items-center gap-1 text-[11px] font-medium transition ${activeTab === 'tools' ? 'text-pureBlue' : 'text-slate-400'}`}
            >
              <i data-lucide="sliders" className="w-5 h-5"></i>
              <span>ឧបករណ៍</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
